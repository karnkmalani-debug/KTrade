name: KTrade
on:
  schedule:
    # GitHub often skips or delays scheduled runs, so there are many tries. The AI only trades once per due day;
    # the other runs just refresh prices.
    - cron: '7,22,37,52 4-9 * * 1-5'  # every 15 min, about 9:37 AM-3:22 PM IST
    - cron: '7,22,37 10 * * 1-5'      # about 3:37-4:07 PM IST - closing price + stop-loss check
  push:                       # a code or settings change starts a run straight away (it only trades if a portfolio is due)
    branches: [main]
    paths: ['run.mjs', 'settings.json']
  workflow_dispatch:
    inputs:
      mode:
        description: 'ai = run AI now, check = refresh prices, reset = start over'
        default: ai
        type: choice
        options: [ai, check, reset]
      force:
        description: 'Trade even if market is closed'
        default: false
        type: boolean
permissions:
  contents: write
concurrency: ktrade
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node run.mjs ${{ github.event.schedule == '7,22,37 10 * * 1-5' && 'check' || github.event_name == 'schedule' && 'auto' || inputs.mode || 'ai' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FORCE: ${{ inputs.force }}
      - run: |
          git config user.name "ktrade-bot"
          git config user.email "ktrade-bot@users.noreply.github.com"
          git add data/state.json
          git diff --cached --quiet || (git commit -m "KTrade update" && git push)
