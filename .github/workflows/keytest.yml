name: Key test (temporary)
on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - run: |
          code=$(curl -s -o out.json -w '%{http_code}' https://api.anthropic.com/v1/messages \
            -H "x-api-key: $KEY" -H "anthropic-version: 2023-06-01" -H "content-type: application/json" \
            -d '{"model":"claude-haiku-5-5","max_tokens":5,"messages":[{"role":"user","content":"Say OK"}]}')
          echo "HTTP $code"; cat out.json; echo
          [ "$code" = "200" ]
        env:
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
